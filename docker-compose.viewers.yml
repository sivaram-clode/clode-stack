# Standalone DB viewer — WhoDB — a run-on-demand testbed, NOT part of the stack.
# It attaches to the running `clode` network (external) and connects to the live
# datastores (db / redis / databend) by their in-network names, so it touches
# nothing in docker-compose.yml and can't affect the running stack.
#
#   Run:   docker compose -f docker-compose.viewers.yml -p viewers up -d
#   Open:  http://localhost:8889     (enter the connection on WhoDB's login)
#   Stop:  docker compose -f docker-compose.viewers.yml -p viewers down
#
# Connection values (local-dev). WhoDB's backend runs ON the clode network, so
# use the IN-NETWORK host names (db / redis / databend), NOT localhost:
#   Postgres  type Postgres  host db        port 5432  user postgres  pass postgres        db <svc> (e.g. brahmi)  schema public
#   Redis     type Redis     host redis     port 6379  pass clode-redis-local              db 0
#   Databend  type MySQL     host databend  port 3307  user databend  pass databend

services:
  whodb:
    image: clidey/whodb:latest
    ports:
      - "8889:8080"
    networks: [clode]
    restart: unless-stopped

networks:
  clode:
    external: true
    name: clode

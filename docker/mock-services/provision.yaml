# provision.yaml — the /pool-manager group's origin→image list.
#
# On each claim the mock identifies the CALLER (source IP → its docker
# container → clode.fork label for forks, else com.docker.compose.service for
# baseline) and looks up the image + env to deploy for the claimed serviceType.
# Re-read on every claim, so edits take effect without restarting mock-services.
#
# `env` is merged into the service-config's env block (origin wins over the
# template). Use it to point a spawned container's call-home at a fork, e.g.
# IKKI_GRPC_ADDR / BRAHMI_URL → the forked ikki/brahmi.
#
# Lookup order: origins.<caller>.<serviceType>  →  default.<serviceType>.

# Tags are `:main` — the versioned tag `stack up --browser`/`--agent` build
# (POOL_BUILDS in scripts/up.py tags `<repo>:<SVC>_TAG|main`, never `:latest`).
default:
  aramb-browser:
    image: clode-stack/brave-head:main
    env:
      IKKI_GRPC_ADDR: ikki:9000
  kairo:
    image: clode-stack/benji:main
    env:
      BRAHMI_URL: http://brahmi:8080
  kairo-ephemeral:
    image: clode-stack/benji:main
    env:
      BRAHMI_URL: http://brahmi:8080

# Per-fork overrides. The key is the caller's fork name (the clode.fork label
# wfork stamps on <svc>-<name> containers). Example: an `ikkifix` fork whose
# forked ikki claims a browser gets the fix image, calling home to ikki-ikkifix.
#
# origins:
#   ikkifix:
#     aramb-browser:
#       image: clode-stack/brave-head:ikkifix
#       env:
#         IKKI_GRPC_ADDR: ikki-ikkifix:9000

# =============================================================================
# minio-proxy — SigV4-preserving reverse proxy in front of MinIO.
#
# ONE-SENTENCE PURPOSE
#   Restore `Accept-Encoding: identity` (what aws-sdk-go-v2 signs) before
#   MinIO validates SigV4, because Cloudflare's edge rewrites it to
#   `gzip, br` in transit and the signed value must match what MinIO
#   receives on the wire.
#
# THREE-LINE PROBLEM STATEMENT
#   Cloudflare's edge unconditionally sets `Accept-Encoding: gzip, br`
#   before the request reaches the tunnel. aws-sdk-go-v2 includes
#   Accept-Encoding in the SigV4 signed-headers set (boto3/aws-cli/mc
#   don't). MinIO validates against what it receives; identity ≠ gzip,br
#   → 403 SignatureDoesNotMatch on every PUT/GET/HEAD/DELETE against
#   `https://minio.srclode.online`.
#
# WHAT THIS PROXY IS NOT
#   TLS termination     — cloudflared does that upstream.
#   Authentication      — MinIO validates SigV4 itself.
#   Rate limiting       — CF WAF is the correct layer for that.
#   Response caching    — S3 semantics forbid caching (versioned reads).
#   Header rewrite in either direction other than Accept-Encoding
#                       — see BLAST RADIUS below; verified minimal.
#
# BLAST RADIUS (verified by tests/sigv4-repro.sh)
#   Truth table (identical PUT payload, hand-signed with openssl):
#      signed AE=identity + wire AE=identity   → CF: 403, direct: 200
#      signed AE=gzip,br  + wire AE=identity   → CF: 200, direct: 403
#      AE NOT in signed-headers set            → CF: 200, direct: 200
#   Fail/pass flips exactly on the Accept-Encoding value; Host,
#   X-Amz-Date, X-Amz-Content-Sha256, and the request body survive CF
#   unchanged. This proxy only rewrites Accept-Encoding + preserves Host.
#
# WHEN YOU SUSPECT THIS PROXY — TWO COMMANDS TO ELIMINATE IT
#   1. curl -I https://minio.srclode.online/       # look for
#                                                  #   X-Proxied-By:
#                                                  #     minio-proxy/1.0
#                                                  # missing → request
#                                                  # never traversed
#                                                  # this proxy at all.
#   2. curl https://minio.srclode.online/_proxy/health/full
#      200 → nginx alive AND minio alive AND DNS resolution between them
#            working. If this passes, the proxy is NOT your bug — look
#            at the SDK / client code.
#      Non-200 → response headers/body tell you which side failed.
#
# FURTHER DEBUGGING
#   /_proxy/health       liveness of nginx alone (does NOT hit minio).
#                        used by the compose healthcheck.
#   /_proxy/echo         returns the exact request headers this proxy
#                        received, plus what it would forward to minio.
#                        use this to check if CF has started mangling a
#                        NEW header we're not accounting for.
#   docker logs clode-minio-proxy-1
#                        access log includes the client-sent Accept-
#                        Encoding value per-request. If it shows the
#                        SDK-expected value and requests still 403, the
#                        signing side is broken, not this proxy.
#
# REGRESSION TESTS
#   docker/minio-proxy/tests/*.sh — hand-rolled SigV4 tests that prove
#   the two-cell truth table on both direct and CF paths. Run any time
#   the CF-fronted path is suspected of new breakage.
# =============================================================================

worker_processes auto;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Required so `minio` in proxy_pass below
    # resolves per-request via the `resolver` directive rather than
    # being cached from the moment nginx started — otherwise a
    # `docker compose restart minio` leaves this proxy pointing at a
    # dead IP until nginx restarts too.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # S3 single-PutObject cap is 5G; anything larger goes via multipart
    # (many smaller requests). Match the cap so we don't reject an
    # upload MinIO would accept.
    client_max_body_size 5G;

    # Stream request + response bodies straight through, no on-disk
    # spooling. Buffering would break STREAMING-AWS4-HMAC-SHA256-PAYLOAD
    # uploads whose signature depends on the exact byte layout of the
    # request as it arrives.
    proxy_request_buffering off;
    proxy_buffering         off;

    # S3 uploads can hold connections for minutes on slow links.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 5s;

    # Access log format — a debugging aid, not a metrics substrate.
    # Emits enough per-line to answer "is the proxy actually rewriting
    # AE for THIS request?" without a tcpdump.
    log_format proxy_debug 'ts=$time_iso8601 '
                           'm=$request_method '
                           'p=$request_uri '
                           'host="$http_host" '
                           'status=$status '
                           'ae_in="$http_accept_encoding" '
                           'ae_out="identity" '
                           'upstream="$upstream_addr" '
                           'upstream_status="$upstream_status" '
                           'upstream_rt="$upstream_response_time" '
                           'sent=$body_bytes_sent';
    access_log /var/log/nginx/access.log proxy_debug;

    # Self-identification header — every response through this proxy
    # carries it. `always` = also emitted on error responses (nginx
    # `add_header` normally suppresses on 4xx/5xx unless `always`).
    # First diagnostic step: `curl -I` the URL. Missing header = the
    # request went somewhere else.
    add_header X-Proxied-By "minio-proxy/1.0" always;

    server {
        listen 80 default_server;
        server_name _;

        # =====================================================================
        # OPERATOR ENDPOINTS — under /_proxy/*
        # These do NOT clash with S3 bucket/key namespaces because MinIO
        # requires a valid bucket name as the first path segment, and
        # `_proxy` starts with an underscore (not a valid bucket
        # character). Any real request to `/_proxy/...` is either us or
        # a typo, safe to shadow.
        # =====================================================================

        # Liveness of nginx alone. Compose healthcheck target.
        # Does NOT touch minio — a healthy proxy + sick minio still
        # reports OK here. You learn about minio from minio's own
        # healthcheck. That separation is deliberate.
        location = /_proxy/health {
            access_log off;
            add_header Content-Type text/plain always;
            add_header X-Proxied-By "minio-proxy/1.0" always;
            return 200 "ok\n";
        }

        # Liveness of the FULL path: proxy → minio. Same header rewrite
        # every real request gets, so a 200 here proves not just that
        # nginx and minio are up but that Accept-Encoding rewrite is
        # working and DNS between them is resolving.
        # Use this endpoint when triaging a suspected S3 outage — before
        # spelunking service code, hit this URL through the public host
        # first. 200 = the proxy is NOT the problem.
        location = /_proxy/health/full {
            access_log off;
            proxy_set_header Accept-Encoding "identity";
            proxy_set_header Host             $http_host;
            proxy_set_header Connection       "";

            # NOTE: no $request_uri here because we're rewriting to a
            # fixed upstream path, not passing the client's URI through.
            set $upstream_minio "minio:9000";
            proxy_pass http://$upstream_minio/minio/health/live;
            proxy_http_version 1.1;

            # Make the proxy-side identity visible even on the health-
            # forwarded response, so `curl -I .../_proxy/health/full`
            # shows X-Proxied-By and confirms the request went through.
            add_header X-Proxied-By "minio-proxy/1.0" always;
        }

        # Echo — returns the exact request headers received (post-CF)
        # and what this proxy would forward to minio. Use when:
        #   - CF starts mangling a NEW header (Accept-Encoding is the
        #     only one today; if a future SDK signs more, this endpoint
        #     is where you spot it).
        #   - Verifying "yes, the value I see on the wire from CF is
        #     `gzip, br`, and yes, we're rewriting to identity".
        # Deliberately omits Authorization (contains SigV4 signature).
        location = /_proxy/echo {
            access_log off;
            add_header Content-Type text/plain always;
            add_header X-Proxied-By "minio-proxy/1.0" always;
            # Single multi-line string — nginx `return` takes exactly
            # one text argument, so this is written as one glob rather
            # than the C-style adjacent-string-concat we can't use here.
            return 200 "── minio-proxy: request as received (post-CF, pre-rewrite) ──
method:               $request_method
uri:                  $request_uri
host:                 $http_host
scheme:               $scheme
user-agent:           $http_user_agent
accept-encoding:      $http_accept_encoding
content-type:         $content_type
content-length:       $content_length
x-amz-content-sha256: $http_x_amz_content_sha256
x-amz-date:           $http_x_amz_date
cf-ray:               $http_cf_ray
cf-connecting-ip:     $http_cf_connecting_ip
authorization:        (omitted — contains SigV4 signature)

── what this proxy forwards to minio:9000 ──
accept-encoding:      identity   (REWRITTEN from client value above)
host:                 $http_host   (PRESERVED — SigV4 signs Host)
everything else:      passthrough (unsigned by SigV4; MinIO ignores)

── the only rewrite is Accept-Encoding. if a SigV4 request that
── worked yesterday now 403s, check the CF-received value above.
";
        }

        # =====================================================================
        # THE ACTUAL PROXY — everything not caught above
        # =====================================================================
        location / {
            # THE fix. Every other line in this file is scaffolding.
            proxy_set_header Accept-Encoding "identity";

            # Preserve the public Host — SigV4 signs Host, so it must
            # match what the client signed (minio.srclode.online). nginx
            # would otherwise set it to $proxy_host (the upstream
            # service name), which would fail signature verification on
            # Host too.
            proxy_set_header Host $http_host;

            # Standard forwarded metadata. Unsigned; MinIO ignores them.
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Variable-form proxy_pass so `resolver` above kicks in on
            # every request (see comment on resolver above). `$request_uri`
            # is the raw request line — path + query — passed verbatim
            # so SigV4's URI canonicalization matches (nginx doesn't
            # URL-decode or re-encode).
            set $upstream_minio "minio:9000";
            proxy_pass http://$upstream_minio$request_uri;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }
    }
}
